kind = "mobile"
previewPath = "/devuelvelo-ya/"
title = "DevuélveloYa"
description = "Una app móvil para guardar compras, consultar fechas límite y seguir devoluciones con una experiencia clara y cuidada."
version = "1.2.0"
id = "artifacts/devuelvelo-ya"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/devuelvelo-ya/" ]
localPort = 18174

[services.development]
run = "pnpm --filter @workspace/devuelvelo-ya run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/devuelvelo-ya", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/devuelvelo-ya", "run", "serve" ]

[services.env]
PORT = "18174"
BASE_PATH = "/devuelvelo-ya/"
